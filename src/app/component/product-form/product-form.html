<div class="row justify-content-center">
     <div class="col-md-6">
       <div class="card">
         <div class="card-header">
           <h3>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h3>
         </div>
         <div class="card-body">
           <div *ngIf="loading" class="text-center">
             <div class="spinner-border" role="status">
               <span class="visually-hidden">Loading...</span>
             </div>
           </div>

           <form *ngIf="!loading" [formGroup]="productForm" (ngSubmit)="onSubmit()">
             <div class="mb-3">
               <label for="name" class="form-label">Product Name *</label>
               <input
                 type="text"
                 class="form-control"
                 id="name"
                 formControlName="name"
                 [class.is-invalid]="productForm.get('name')?.invalid && productForm.get('name')?.touched"
               />
               <div class="invalid-feedback" *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched">
                 <div *ngIf="productForm.get('name')?.errors?.['required']">Product name is required</div>
                 <div *ngIf="productForm.get('name')?.errors?.['maxlength']">Name cannot exceed 255 characters</div>
               </div>
             </div>

             <div class="mb-3">
               <label for="description" class="form-label">Description</label>
               <textarea
                 class="form-control"
                 id="description"
                 rows="3"
                 formControlName="description"
               ></textarea>
             </div>

             <div class="mb-3">
               <label for="price" class="form-label">Price *</label>
               <input
                 type="number"
                 class="form-control"
                 id="price"
                 formControlName="price"
                 step="0.01"
                 min="0"
                 [class.is-invalid]="productForm.get('price')?.invalid && productForm.get('price')?.touched"
               />
               <div class="invalid-feedback" *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">
                 <div *ngIf="productForm.get('price')?.errors?.['required']">Price is required</div>
                 <div *ngIf="productForm.get('price')?.errors?.['min']">Price must be greater than or equal to 0</div>
               </div>
             </div>

             <div class="mb-3">
               <label for="category_id" class="form-label">Category *</label>
               <select
                 class="form-control"
                 id="category_id"
                 formControlName="category_id"
                 [class.is-invalid]="productForm.get('category_id')?.invalid && productForm.get('category_id')?.touched"
               >
                 <option value="">Select a category</option>
                 <option *ngFor="let category of categories" [value]="category.id">
                   {{ category.name }}
                 </option>
               </select>
               <div class="invalid-feedback" *ngIf="productForm.get('category_id')?.invalid && productForm.get('category_id')?.touched">
                 <div *ngIf="productForm.get('category_id')?.errors?.['required']">Category is required</div>
               </div>
             </div>

             <div class="d-flex gap-2">
               <button type="submit" class="btn btn-primary" [disabled]="!productForm.valid">
                 {{ isEditMode ? 'Update' : 'Create' }}
               </button>
               <button type="button" class="btn btn-secondary" (click)="onCancel()">
                 Cancel
               </button>
             </div>
           </form>
         </div>
       </div>
     </div>
   </div>
